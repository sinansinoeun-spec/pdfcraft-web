name: Deploy PdfCraft to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - PdfCraft-iPad-web.zip
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Extract the PdfCraft web app
        run: |
          mkdir -p _site
          unzip -q PdfCraft-iPad-web.zip -d _site
          test -f _site/index.html
          test -n "$(find _site -maxdepth 1 -name '*.wasm' -print -quit)"
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
